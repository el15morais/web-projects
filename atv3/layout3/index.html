<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Github</title>
</head>
<body>
    <header>
        <nav class="nav-bar">
            <div class="logo">
                <img src="uploads/github.png" alt="Logo github" width="42" height="42">
            </div>
            <ul class="departments">
                <li>Plataforma <i class="fa-solid fa-angle-down arrow-icon"></i></li>
                <li>Soluções <i class="fa-solid fa-angle-down arrow-icon"></i></li>
                <li>Recursos <i class="fa-solid fa-angle-down arrow-icon"></i></li>
                <li>Código Aberto <i class="fa-solid fa-angle-down arrow-icon"></i></li>
                <li>Enterprise <i class="fa-solid fa-angle-down arrow-icon"></i></li>
                <li>Preços</li>
            </ul>
        </nav>
        <div class="action-buttons">
            <button class="search-button"><img src="uploads/search-interface-symbol.png" alt="search icon"></button>
            <button class="login-button">Entrar</button>
            <button class="sign-up-button">Criar uma conta</button>
        </div>
    </header>
    <main>
        <section class="hero">
            <h1 class="title">O futuro do desenvolvimento de software acontece em conjunto</h1>
            <p class="content">As ferramentas e as tendências evoluem, mas a colaboração permanece. Com o Github, desenvolvedores, agentes e código se unem em uma única plataforma</p>
            <div class="action-elements">
                <div class="email-group">
                    <input class="email-field" type="email" placeholder="Digite seu e-mail">
                    <button class="submit-email">Cadastrar-se no Github</button>
                </div>
                <button class="experiment-github">Experimente o GitHub Copilot Free</button>
            </div>
        </section>
    </main>
</body>
</html>
